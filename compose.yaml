services:
  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    # get value from .env when value is empty
    environment:
      POSTGRES_USER_FILE: /run/secrets/postgres-user
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
      POSTGRES_DB_FILE: /run/secrets/postgres-db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    secrets:
      - postgres-user
      - postgres-password
      - postgres-db
    healthcheck:
      test: ["CMD-SHELL", "psql -U $$(cat /run/secrets/postgres-user) -d $$(cat /run/secrets/postgres-db) -c 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
  seq:
    image: datalust/seq:2025.2
    container_name: seq
    restart: unless-stopped
    environment:
      ACCEPT_EULA: Y
      SEQ_FIRSTRUN_ADMINUSERNAME:
      SEQ_FIRSTRUN_ADMINPASSWORDHASH:
    ports:
      - "5341:80"
    volumes:
      - seq-data:/data
  backend:
    build:
      context: ./backend
      dockerfile: src/Api/Dockerfile
    container_name: backend
    restart: unless-stopped
    ports:
      - "5000:8080"
    depends_on:
      postgres:
        condition: service_healthy
      seq:
        condition: service_started
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    secrets:
      - appsettings.Secrets.json
volumes:
  postgres-data:
  seq-data:
secrets:
  postgres-user:
    file: ./postgres/postgres_user.txt
  postgres-password:
    file: ./postgres/postgres_password.txt
  postgres-db:
    file: ./postgres/postgres_db.txt
  appsettings.Secrets.json:
    file: ./backend/src/Api/appsettings.Secrets.json