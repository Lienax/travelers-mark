services:
  postgres:
    image: postgres:16
    container_name: postgres
    restart: always
    # get value from .env when value is empty
    environment:
      POSTGRES_USER_FILE: /run/secrets/postgres-user
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
      POSTGRES_DB_FILE: /run/secrets/postgres-db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    secrets:
      - postgres-user
      - postgres-password
      - postgres-db
  seq:
    image: datalust/seq:2025.2
    container_name: seq
    restart: always
    environment:
      ACCEPT_EULA: Y
      SEQ_FIRSTRUN_ADMINUSERNAME:
      SEQ_FIRSTRUN_ADMINPASSWORDHASH:
    ports:
      - "5341:80"
    volumes:
      - seq-data:/data
  backend:
    build:
      context: ./backend
      dockerfile: src/Api/Dockerfile
    container_name: backend
    ports:
      - "5000:8080"
    depends_on:
      - postgres
      - seq
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
volumes:
  postgres-data:
  seq-data:
secrets:
  postgres-user:
    file: ./postgres/postgres_user.txt
  postgres-password:
    file: ./postgres/postgres_password.txt
  postgres-db:
    file: ./postgres/postgres_db.txt